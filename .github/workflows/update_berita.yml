name: Robot Pencari Berita Otomatis

on:
  schedule:
    # Berjalan otomatis setiap jam 08:00 WITA (00:00 UTC)
    - cron: '0 0 * * *'
  # Memungkinkan kita memicu robot ini secara manual pakai tombol
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wajib agar robot diizinkan push artikel ke repo

    steps:
      - name: 1. Buka Repository
        uses: actions/checkout@v4

      - name: 2. Siapkan Mesin Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Alat Bantu (Requests & Feedparser)
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: 4. Jalankan Jurnalis AI
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python auto_news.py

      - name: 5. Simpan dan Terbitkan ke Cloudflare
        run: |
          git config --global user.name "AI News Bot"
          git config --global user.email "bot@ididenpasar.org"
          git add .
          git commit -m "Update Otomatis: Artikel AI Baru" || echo "Tidak ada berita baru hari ini"
          git push
