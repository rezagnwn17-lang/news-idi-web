name: Robot Pencari Berita Otomatis

on:
  schedule:
    # Berjalan otomatis setiap jam 08:00 WITA (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Buka Repository
        uses: actions/checkout@v4

      - name: 2. Siapkan Mesin Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Alat Bantu
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: 4. Jalankan Jurnalis AI
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python auto_news.py

      - name: 5. Simpan dan Terbitkan ke Cloudflare
        run: |
          git config --global user.name "AI News Bot"
          git config --global user.email "bot@ididenpasar.org"
          git add .
          git commit -m "Update Otomatis: Artikel AI Baru" || echo "Tidak ada berita baru hari ini"
          git push

      - name: 6. Kirim Laporan ke Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" == "success" ]; then
            MESSAGE="✅ *Laporan Jurnalis IDI*\n\nBerita hari ini berhasil dicari, ditulis AI, dan sukses tayang di website! 🚀"
          else
            MESSAGE="❌ *Laporan Jurnalis IDI*\n\nGawat, robot gagal menjalankan tugas pagi ini. Cek GitHub ya!"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=$MESSAGE" \
          -d "parse_mode=Markdown"
