name: Robot Pencari Berita Otomatis

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Buka Repository
        uses: actions/checkout@v4

      - name: 2. Siapkan Mesin Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Alat Bantu
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: 4. Jalankan Jurnalis AI
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python auto_news.py

      - name: 5. Simpan dan Terbitkan ke Cloudflare
        run: |
          git config --global user.name "AI News Bot"
          git config --global user.email "bot@ididenpasar.org"
          git add .
          git commit -m "Update Otomatis: Artikel AI Baru" || echo "Tidak ada berita baru hari ini"
          git push

      - name: 6. Kirim Laporan ke Telegram
        uses: appleboy/telegram-action@master
        if: always()
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Laporan Jurnalis AI IDI:
            Status eksekusi: ${{ job.status }}
            
            Berita hari ini berhasil diproses. Silakan cek website! 🚀
