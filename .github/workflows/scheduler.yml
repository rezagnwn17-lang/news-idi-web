name: Robot Redaksi IDI Denpasar

on:
  schedule:
    - cron: '0 1,10 * * *' 
  workflow_dispatch:

jobs:
  jalankan_robot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Mengambil Kode
      uses: actions/checkout@v3

    - name: Menyiapkan Mesin Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Memasang Peralatan (Install Dependencies)
      run: pip install -r requirements.txt

    - name: Membangunkan Robot auto_news.py
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python auto_news.py
